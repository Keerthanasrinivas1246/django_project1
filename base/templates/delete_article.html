{% extends 'main.html' %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/delete_article.css' %}">

<div class="delete-container">

    <div class="delete-box">

        <h2>Delete Article</h2>

        <p class="warning-icon">⚠️</p>

        <h4>
            Are you sure you want to delete
            <br>
            <span>"{{ data.title }}"</span>?
        </h4>

        <form method="POST">

            {% csrf_token %}

            <button type="submit" class="delete-confirm-btn">
                Yes, Delete
            </button>

        </form>

        <br>

        <a href="{% url 'read_article' %}" class="cancel-btn">
            No, Cancel
        </a>

    </div>

</div>

{% endblock %}
