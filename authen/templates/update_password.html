{% extends 'main.html' %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/update_password.css' %}">

<div class="password-container">

    <div class="password-card">

        <div class="password-icon">
            🔒
        </div>

        <h2>Update Password</h2>

        <form method="POST" id="passwordForm">

            {% csrf_token %}

            <input
                type="password"
                id="currentPassword"
                name="current_password"
                placeholder="Current Password"
                required
            >

            <input
                type="password"
                id="newPassword"
                name="new_password"
                placeholder="New Password"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                name="confirm_password"
                placeholder="Confirm Password"
                required
            >

            <button type="submit" class="password-submit-btn">
                Update Password
            </button>

        </form>

    </div>

</div>

<script>

const form = document.getElementById("passwordForm");

form.addEventListener("submit", function(e){

    const current = document.getElementById("currentPassword");
    const newPass = document.getElementById("newPassword");
    const confirm = document.getElementById("confirmPassword");

    if(current.value.trim()==="" || newPass.value.trim()==="" || confirm.value.trim()===""){

        e.preventDefault();
        alert("Please fill all fields.");
        return;

    }

    if(newPass.value !== confirm.value){

        e.preventDefault();
        alert("New Password and Confirm Password do not match.");

        confirm.style.border="2px solid red";

    }

});

document.querySelectorAll(".password-card input").forEach(input=>{

    input.addEventListener("focus",function(){

        this.style.borderColor="#0d6efd";

    });

    input.addEventListener("blur",function(){

        this.style.borderColor="#ccc";

    });

});

</script>

{% endblock %}
